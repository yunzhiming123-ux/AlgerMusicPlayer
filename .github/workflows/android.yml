name: Build Android APK

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 接口地址：优先读取仓库 Secret VITE_API；未配置时回退到官方 APK 内置的接口，
      # 因此不设置 Secret 也能直接打包（需要换接口时再去 Settings → Secrets 配置）
      - name: Create env file
        env:
          SECRET_VITE_API: ${{ secrets.VITE_API }}
        run: |
          API_URL="${SECRET_VITE_API}"
          if [ -z "${API_URL}" ]; then
            API_URL="http://mc.alger.fun/api"
            echo "::notice::未配置 Secret VITE_API，使用默认官方接口 ${API_URL}"
          fi
          echo "VITE_API=${API_URL}" > .env.production.local
          cat .env.production.local
          case "${API_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error::VITE_API 必须以 http:// 或 https:// 开头：${API_URL}"
              exit 1
              ;;
          esac

      # 跳过 electron 下载等安装脚本，网页构建不需要
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build web
        run: npm run build

      # 显式确保编译所需的 SDK 组件（部分 runner 镜像缺少 platforms/build-tools 会直接导致 assembleDebug 失败）
      - name: Ensure Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          "$SDKM" --list_installed | grep -E "platforms;android-35|build-tools;35" || echo "sdk list unavailable"

      - name: Prepare Android platform
        run: |
          rm -rf android
          npx cap add android
          node scripts/android-enable-cleartext.js
          npx cap sync android

      # 失败时把 Gradle 错误摘录成 annotation（public 仓库可匿名通过 API 读取，便于定位）
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" || true
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::group::gradle - What went wrong"
            awk '/What went wrong:/{f=1} f{print} /^BUILD FAILED/{if(f) exit}' "$RUNNER_TEMP/gradle.log" | head -n 40 || true
            echo "::endgroup::"
            if grep -q "What went wrong" "$RUNNER_TEMP/gradle.log"; then
              awk '/What went wrong:/{f=1} f{print} /^BUILD FAILED/{if(f) exit}' "$RUNNER_TEMP/gradle.log" | head -n 10
            else
              tail -n 10 "$RUNNER_TEMP/gradle.log"
            fi | while IFS= read -r line; do echo "::error::gradle: ${line:0:180}"; done
            exit "$code"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
