name: Build Android APK

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 接口地址：优先读取仓库 Secret VITE_API；未配置时回退到官方 APK 内置的接口，
      # 因此不设置 Secret 也能直接打包（需要换接口时再去 Settings → Secrets 配置）
      - name: Create env file
        env:
          SECRET_VITE_API: ${{ secrets.VITE_API }}
        run: |
          API_URL="${SECRET_VITE_API}"
          if [ -z "${API_URL}" ]; then
            API_URL="http://mc.alger.fun/api"
            echo "::notice::未配置 Secret VITE_API，使用默认官方接口 ${API_URL}"
          fi
          echo "VITE_API=${API_URL}" > .env.production.local
          cat .env.production.local
          case "${API_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error::VITE_API 必须以 http:// 或 https:// 开头：${API_URL}"
              exit 1
              ;;
          esac

      # 跳过 electron 下载等安装脚本，网页构建不需要
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Prepare Android platform
        run: |
          rm -rf android
          npx cap add android
          node scripts/android-enable-cleartext.js
          npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
